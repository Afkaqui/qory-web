services:
  qory-web:
    build: .
    container_name: qory-web
    restart: always
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - APP_URL=${APP_URL}
    networks:
      - default
      - postgresql_default

networks:
  postgresql_default:
    external: true
